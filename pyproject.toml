[project]
name = "cooking-clipper"
version = "1.0.0"
description = "Motion-based highlight extraction for cooking videos"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
