apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooking-clipper-operator
  namespace: cooking-clipper
  labels:
    app: cooking-clipper
    component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cooking-clipper
      component: operator
  template:
    metadata:
      labels:
        app: cooking-clipper
        component: operator
    spec:
      serviceAccountName: cooking-clipper-operator
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: operator
          image: ghcr.io/joao-zanutto/cooking-clipper-operator:20 # {"$imagepolicy": "flux-system:cooking-clipper-operator"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # SeaweedFS / S3 connection
            - name: S3_ENDPOINT
              value: "http://192.168.15.14:8333"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ACCESS_KEY_ID
              value: "aa"
            - name: S3_SECRET_ACCESS_KEY
              value: "aa"
            # SeaweedFS master (fallback for bucket listing)
            - name: SEAWEEDFS_MASTER_URL
              value: "http://192.168.15.14:9333"
            # Job configuration
            - name: JOB_IMAGE
              value: "ghcr.io/joao-zanutto/cooking-clipper:20" # {"$imagepolicy": "flux-system:cooking-clipper"}
            - name: JOB_IMAGE_PULL_POLICY
              value: "Always"
            - name: OPERATOR_PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
