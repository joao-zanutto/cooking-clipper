<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooking Clipper</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>🍳 Cooking Clipper</h1>
      <div class="header-controls">
        <label
          >Project (bucket):
          <select id="bucket-select">
            <option value="">— Select —</option>
          </select>
        </label>
        <button id="refresh-btn" title="Refresh">⟳</button>
      </div>
    </header>

    <!-- Main -->
    <main id="main">
      <div class="placeholder">Select a project to see videos</div>
    </main>

    <!-- Batch controls -->
    <div id="batch-bar" class="hidden">
      <div class="batch-params">
        <label
          >Clip duration:
          <input
            type="range"
            id="batch-clip"
            min="0.5"
            max="10"
            step="0.5"
            value="2.5"
          />
          <span id="batch-clip-val">2.5</span>s</label
        >
        <label
          >Motion threshold:
          <input
            type="range"
            id="batch-motion"
            min="0.01"
            max="1.0"
            step="0.01"
            value="0.15"
          />
          <span id="batch-motion-val">0.15</span></label
        >
        <label
          >Change threshold:
          <input
            type="range"
            id="batch-change"
            min="5"
            max="100"
            step="5"
            value="20"
          />
          <span id="batch-change-val">20</span></label
        >
      </div>
      <div class="batch-actions">
        <button id="apply-all-btn">Apply to all</button>
        <button id="process-all-btn">Process all unprocessed</button>
      </div>
    </div>

    <!-- Video grid -->
    <div id="video-grid" class="hidden"></div>

    <!-- Status toast -->
    <div id="toast" class="hidden"></div>

    <!-- Video preview modal -->
    <div id="video-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" title="Close">
          &times;
        </button>
        <video id="modal-video" controls preload="auto"></video>
        <div id="modal-placeholder" class="modal-placeholder">
          Video still not processed
        </div>
        <div class="modal-chart-wrapper">
          <canvas id="modal-chart"></canvas>
        </div>
        <div id="modal-stats" class="modal-stats"></div>
      </div>
    </div>

    <!-- Job list -->
    <section id="jobs-section" class="hidden">
      <h2>Jobs</h2>
      <div id="job-list"></div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
