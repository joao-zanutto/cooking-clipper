version: "3.8"

services:
  cooking-clipper:
    build: .
    container_name: cooking-clipper
    environment:
      - S3_ENDPOINT=http://192.168.15.14:8333
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=aa
      - S3_SECRET_ACCESS_KEY=aa
    volumes:
      - ./.env:/app/.env:ro
      - ./output:/app/output
    # Run with: docker compose run --rm cooking-clipper s3://bucket/video.mov
    # Or:      docker compose run --rm cooking-clipper --help
    entrypoint: ["python", "split.py"]
    command: ["--help"]
